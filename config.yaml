# quantrift_stock — 配置文件
# 仅发 Telegram 信号告警，不执行下单

# ── Telegram 告警配置 ──────────────────────────────────────────────────
# 留空则不发告警；也可通过环境变量 TG_TOKEN / TG_CHAT_ID 配置
telegram:
  token: ""
  chat_id: ""

# ── IB Gateway 配置 ────────────────────────────────────────────────────
ib:
  host: "127.0.0.1"
  port: 4002       # 模拟盘；实盘改 4001
  client_id: 2     # 期货引擎用 1，不能冲突

# ── 标的列表（v2 分类） ──────────────────────────────────────────────────
# 策略说明见 LEARNING.md
symbols:
  # ConfluenceStrategy（高 ADX 动量，趋势跟踪）
  momentum:    [NVDA, MU, MRVL]

  # 高波动单股：独立处理，不与 momentum 混桶
  high_vol:    [TSLA]

  # 存储周期股：ConfluenceStrategy 谨慎使用（财报驱动、周期强）
  storage:     [SNDK, STX]

  # Mega-cap compounders：RSI2 + Market Regime Score + RS 过滤（4h/1d）
  mega_cap:    [MSFT, GOOGL, META, PLTR]

  # 弱化/待观察：RSI2 Sharpe 低，暂不纳入主策略池
  # INTC：1h Confluence Sharpe 0.67（95笔），2026-07-02 从 watch_candidates 升级
  watch:       [AAPL, INTC]

  # 选股初筛发现的候选（连续 Top5 SP500/NDX），待 backtest_runner 验证参数后升级
  # AMD/AMAT/KLAC：回测最优 Sharpe 0.52/0.36/0.05，未达 0.6 门槛（2026-07-02）
  # DELL 已于 2026-07-25 用新参数重跑达标（1h Confluence 0.83 / 4h RSI2 0.85），升级至 watchlist_2026_07
  watch_candidates: [AMD, AMAT, KLAC]

  # 待专项研究：RSI2 失效（Sharpe 0.27），ConfluenceStrategy 待验证
  # 备选方案："距 20 日高点回撤 5-10% + RSI 40-55"
  pending:     [AMZN]

  # 高波动/新兴标的：波动大、上市时间短或流动性较低，需专项回测后决定策略
  # RKLB：太空/火箭；NBIS：AI基础设施（前Yandex）；IREN：AI算力/比特币矿
  # IREN 已于 2026-07-26 验证达标（1h Confluence Sharpe 1.15 N=230，30bps 仍 0.72，
  # walk-forward 训练0.73→测试1.76），升级至 watchlist_2026_07
  pending_high_vol: [RKLB, NBIS]

  # 半导体 ETF：RSI2（不强制 RS vs QQQ）或 MR+ATR（待重新调参）
  sector_etf:  [SOXX, SMH]

  # 宽基 ETF：RSI2 benchmark 模式（不参与 RS 过滤）
  broad_etf:   [QQQ, SPY]

  # 2026-07-25 用户提供 watchlist 批量回测新增（157个候选 -> 30个通过 Sharpe>=0.6 且 N>=30）
  # 方法：yfinance 拉取 1h/4h/1d -> Confluence/RSI2(默认参数)/Breakout(默认参数) 三策略回测
  #      -> 取每个 (symbol,tf) 最优 Sharpe -> 剔除退化结果(WR=100%或RR=0，多为货币基金/近零波动品种伪信号)
  #      -> 剔除货币基金/短债ETF(SGOV/BND等) -> 剩余即本组
  # 杠杆/反向ETF(SOXS/SPXU等)即使达标也不自动列入，见 LEARNING.md 说明
  # 2026-07-25 补跑：用户追问的 HOOD/EU/XYZ/COIN/DELL 中仅 HOOD/DELL 达标（COIN/EU/XYZ 三策略全周期均未达标，未列入）
  # 2026-07-25 MR策略补测：对107个未达标标的跑MR均值回归，仅 TSM/FDVV 达标（TSM/FDVV 首次由MR接入，非Confluence/RSI2/Breakout）
  # 2026-07-25 第四版watchlist（用户扩充到293个代码后）批量回测：89个新标的 -> 21个达标（含1个MR/8个Confluence/15个RSI2）
  # SMR 1h RSI2 Sharpe 0.686 但最大回撤-95.12%（小盘核能股暴涨暴跌），风险过高排除，不接入
  # 2026-07-25 网格优化：对60个"默认参数接近达标(Sharpe 0.35-0.6)"的标的跑RSI2_GRID×Confluence网格，
  # 42个(symbol,tf)组合达标，SLS 1h RSI2最大回撤-56.9%风险过高排除，改用其Confluence 1h结果(0.76, -0%DD)
  # 注：RGTI/AIRJ/CCJ/MSTR/UP/AAOI/HBM/DUOL/CRSP/APLD 等多个1h RSI2组合回撤在20-40%区间，
  # 明显高于原主池标的，接入后需观察实盘信号质量，必要时收紧atr_sl_mult
  # 2026-07-26 walk-forward 验证降级：CEG/DUOL/FWRG/GME/PYPL/STLA 六个标的的唯一路由
  # 在样本外测试期 Sharpe 转负（训练 0.83~1.89 → 测试 -0.29~-2.24），已整体移出扫描池；
  # CCJ/LLY/UP 各降级一个周期但保留其他合格路由。详见 watchlist_validation.csv
  # 2026-07-26 PANW（Palo Alto Networks）应用户要求加入：四策略回测仅 1h RSI2 达标
  # (Sharpe 0.683 N=117 DD-12.2%)；成本压力 10bps 通过、walk-forward 训练0.37→测试0.84（样本外更优）
  watchlist_2026_07: [AAOI, AGI, AIRJ, AIS, ALL, AMC, APLD, APO, BA, BABA, BAC, BB,
                       BBW, BE, CBUS, CCB, CCJ, CRCL, CRSP, CRWD, CRWV, DELL, DGRO, DJT,
                       FDVV, FOF, FOX, GE, GFS, GL, GOOG, HBM, HOOD, IBM, INTU, IREN,
                       JPM, KO, LLY, LMT, LTL, LUNR, LVHI, LWLG, MKSI, MO, MORN, MS,
                       MSOS, MSTR, NFLX, NTRS, OC, OKLO, ONDS, ORCL, OSCR, PANW, PB, PKW,
                       QCOM, RBC, RBLX, REMX, RGTI, SAP, SKM, SLS, SLV, SMCI, SOFI, SPCX,
                       SPMO, SPXC, SPYM, TMC, TSM, UP, USAR, USO, VC, VOO, VTI, WBD,
                       WDC, WMT]
  # SPCX（Space Exploration Technologies Corp，2026-06-12上市）：应用户明确要求接入实盘扫描，
  # 但 1d 仅28行数据，任何策略都无法跑出有意义的回测（RSI2/MR需200+天，Breakout需252+天）。
  # 未在 STRATEGY_MAP 显式指定策略 -> 默认走 confluence（1h有201根K线，够Confluence最低50根门槛）。
  # ⚠️ 这是本系统里唯一一个未经任何回测验证就接入实盘的标的，需等1d数据积累到至少210天后补跑
  # RSI2/MR回测、252天后补跑Breakout，重新评估是否要切换/调整策略。

# ── 数据设置 ────────────────────────────────────────────────────────────
data:
  dir: "data"
  provider: "yfinance"     # 数据源：yfinance | tastytrade（未来）| ib（未来）
  # yfinance 下载范围
  start_1h: "2023-01-01"   # 1h 最多 730 天
  start_4h: "2023-01-01"   # 由 1h 重采样
  start_1d: "2020-01-01"

# ── 策略参数（per timeframe） ────────────────────────────────────────────
# 注意：这是初始默认值，各标的需独立优化
# contract_size=1（股票无乘数），n_contracts=1（回测用固定1手）
timeframes:
  1h:
    interval: 1h
    # 信号参数
    min_score: 5
    adx_len: 14
    adx_threshold: 25.0      # 股票 ADX 普遍低于期货，从 30 降至 25
    use_adx: true
    use_vol: true
    use_bbmc_dir: true
    use_ci: true
    use_squeeze_mr: false
    use_staged_tp: true
    use_trend_filter: true   # B: 只在趋势方向开仓（1h 用 200期≈8周 SMA）
    use_regime_filter: true  # Market Regime Score >= min_market_score 才开多
    min_market_score: 2      # 分数范围 -1~4（4个正分 -1跌破20日低）
    use_breakeven_after_tp1: false
    allow_short: true
    max_market_score_short: 2  # 只有 Regime <= 2 才做空（≥3 为强牛市，禁空）
    allow_reversal_flip: true
    # 指标参数
    ut_atr: 8
    ut_key: 1.5              # 股票波动率较低，稍放宽止损
    ssl_len: 20
    ssl2_len: 10
    ssl_mult: 0.22
    exit_len: 14
    rsi_len: 17
    rsi_ob: 70
    rsi_os: 30
    rsi_mr_ob: 65.0
    rsi_mr_os: 35.0
    macd_fast: 12
    macd_slow: 26
    macd_signal: 7
    sqz_bbl: 20
    sqz_bbm: 2.0
    sqz_kcl: 20
    sqz_kcm: 2.4
    ci_len: 14
    ci_threshold: 61.8
    vol_len: 20
    vol_mult: 1.0
    trend_filter_len: 200    # 1h: 200小时 ≈ 8周，作为中期趋势基准
    # 止盈止损
    atr_tp1_mult: 1.0
    atr_tp2_mult: 4.0        # A: 从2.0放宽到4.0，让利润单跑更远
    tp1_portion: 0.34
    use_fixed_initial_sl: true  # D: stage=1 用固定止损，TP1后切换追踪
    atr_sl_mult: 1.5
    reversal_score: 2
    conflict_threshold: 2
    # 回测参数（不影响告警逻辑）
    n_contracts: 1
    contract_size: 1         # 股票：$1/点
    cash: 100000
    commission: 0.001        # 0.1% 双边手续费
    margin: 0.5              # Reg T 50%

  4h:
    interval: 4h
    min_score: 5
    adx_len: 14
    adx_threshold: 25.0
    use_adx: true
    use_vol: true
    use_bbmc_dir: true
    use_ci: true
    use_squeeze_mr: false
    use_staged_tp: true
    use_trend_filter: true   # B: 只在趋势方向开仓（4h 用 100期≈50天 SMA）
    use_regime_filter: true
    min_market_score: 2
    use_breakeven_after_tp1: false
    allow_short: true
    max_market_score_short: 2  # 只有 Regime <= 2 才做空（≥3 为强牛市，禁空）
    allow_reversal_flip: true
    ut_atr: 5
    ut_key: 2.0
    ssl_len: 40
    ssl2_len: 13
    ssl_mult: 0.35
    exit_len: 17
    rsi_len: 17
    rsi_ob: 70
    rsi_os: 30
    rsi_mr_ob: 65.0
    rsi_mr_os: 35.0
    macd_fast: 12
    macd_slow: 26
    macd_signal: 10
    sqz_bbl: 20
    sqz_bbm: 2.3
    sqz_kcl: 20
    sqz_kcm: 1.5
    ci_len: 14
    ci_threshold: 61.3
    vol_len: 20
    vol_mult: 1.0
    trend_filter_len: 100    # 4h: 100×4h ≈ 50天，作为中期趋势基准
    atr_tp1_mult: 1.0
    atr_tp2_mult: 3.0        # A: 从2.0放宽到3.0
    tp1_portion: 0.34
    use_fixed_initial_sl: true  # D: stage=1 用固定止损
    atr_sl_mult: 1.5
    reversal_score: 2
    conflict_threshold: 2
    n_contracts: 1
    contract_size: 1
    cash: 100000
    commission: 0.001
    margin: 0.5

  1d:
    interval: 1d
    min_score: 3
    adx_len: 14
    adx_threshold: 20.0
    use_adx: true
    use_vol: true
    use_bbmc_dir: true
    use_ci: false
    use_squeeze_mr: false
    use_staged_tp: true
    use_trend_filter: true
    use_regime_filter: true
    min_market_score: 2
    use_breakeven_after_tp1: false
    allow_short: true
    max_market_score_short: 2  # 只有 Regime <= 2 才做空（≥3 为强牛市，禁空）
    allow_reversal_flip: true
    ut_atr: 5
    ut_key: 3.0
    ssl_len: 40
    ssl2_len: 3
    ssl_mult: 0.34
    exit_len: 15
    rsi_len: 17
    rsi_ob: 70
    rsi_os: 30
    rsi_mr_ob: 65.0
    rsi_mr_os: 35.0
    macd_fast: 12
    macd_slow: 26
    macd_signal: 8
    sqz_bbl: 20
    sqz_bbm: 1.97
    sqz_kcl: 20
    sqz_kcm: 1.3
    ci_len: 14
    ci_threshold: 70.9
    vol_len: 20
    vol_mult: 1.0
    trend_filter_len: 200    # 1d: 200日 SMA，标准牛熊分界线
    atr_tp1_mult: 1.0
    atr_tp2_mult: 3.0        # A: 从2.0放宽到3.0
    tp1_portion: 0.34
    use_fixed_initial_sl: true  # D: stage=1 用固定止损
    atr_sl_mult: 2.0         # 1d 波动更大，初始止损给更多空间
    reversal_score: 3
    conflict_threshold: 2
    n_contracts: 1
    contract_size: 1
    cash: 100000
    commission: 0.001
    margin: 0.5

# ── 各标的参数覆盖（只写需要覆盖的字段，其余继承 timeframes 默认值） ──────
symbol_params:
  AAPL:
    1h:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 5}
    4h:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 4}
    1d:  {adx_threshold: 25.0, ut_key: 3.0, min_score: 5}
  MSFT:
    1h:  {adx_threshold: 20.0, ut_key: 1.0, min_score: 5}
    4h:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 4}
    1d:  {adx_threshold: 15.0, ut_key: 2.5, min_score: 4}
  GOOGL:
    1h:  {adx_threshold: 15.0, ut_key: 2.5, min_score: 4}
    4h:  {adx_threshold: 25.0, ut_key: 3.0, min_score: 4}
    1d:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 4}
  AMZN:
    1h:  {adx_threshold: 25.0, ut_key: 3.0, min_score: 5}
    4h:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 5}
    1d:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 5}
  META:
    1h:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 5}
    4h:  {adx_threshold: 20.0, ut_key: 1.5, min_score: 5}
    1d:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 5}
  NVDA:
    # 1h: ConfluenceStrategy 全网格最优 Sharpe -0.72，RSI2 v2 -0.93，结构性剔除
    4h:  {adx_threshold: 20.0, ut_key: 3.0, min_score: 5}   # Confluence Sharpe 0.60（样本不足）
    1d:  {adx_threshold: 30.0, ut_key: 2.5, min_score: 4}   # Confluence Sharpe 0.64 → RSI2 v2 更优 Sharpe 0.867（entry=5, trail=2×, hold≤15, score≥1）
  TSLA:
    1h:  {adx_threshold: 25.0, ut_key: 2.5, min_score: 4}   # 1h 无效，不做主力
    4h:  {adx_threshold: 30.0, ut_key: 3.0, min_score: 5}   # 样本不足（23笔），仅参考
    1d:  {adx_threshold: 25.0, ut_key: 2.0, min_score: 4, use_breakeven_after_tp1: true}  # ut_key=2.0 → TP1后止损仍低于入场价1ATR，须保本
  SNDK:
    1h:  {adx_threshold: 15.0, ut_key: 1.5, min_score: 5}
    4h:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 4}
    1d:  {adx_threshold: 30.0, ut_key: 3.0, min_score: 4}
  MU:
    1h:  {adx_threshold: 30.0, ut_key: 2.0, min_score: 5}   # Confluence Sharpe 1.58（主力）
    4h:  {adx_threshold: 20.0, ut_key: 1.0, min_score: 4}   # Confluence Sharpe 1.04（备选：RSI2 entry=15 trail=2× Sharpe 1.67⚠️20笔）
    1d:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 4}   # Confluence 废（0.23）→ 用 RSI2 entry=5 trail=3× hold≤10 score≥3 Sharpe 0.94
  STX:
    1h:  {adx_threshold: 30.0, ut_key: 3.0, min_score: 4}
    4h:  {adx_threshold: 25.0, ut_key: 1.5, min_score: 4}
    1d:  {adx_threshold: 20.0, ut_key: 1.5, min_score: 4}
  MRVL:
    1h:  {adx_threshold: 15.0, ut_key: 1.0, min_score: 5, use_breakeven_after_tp1: true}  # Confluence Sharpe 0.94（RR 0.88，保本止损已加）
    4h:  {adx_threshold: 30.0, ut_key: 3.0, min_score: 4}   # Confluence Sharpe 0.72（样本不足） → RSI2 4h 1.123⚠️（N=25 不可信）
    1d:  {adx_threshold: 20.0, ut_key: 3.0, min_score: 4}   # Confluence 0.37 → 换 RSI2 v2：entry=15, trail=2×, hold≤5, score≥2, Sharpe 0.748
  SOXX:
    1h:  {adx_threshold: 15.0, ut_key: 2.5, min_score: 5}
    4h:  {adx_threshold: 15.0, ut_key: 1.0, min_score: 5}
    1d:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 4}
  SMH:
    1h:  {adx_threshold: 15.0, ut_key: 1.5, min_score: 5}
    4h:  {adx_threshold: 20.0, ut_key: 3.0, min_score: 4}
    1d:  {adx_threshold: 20.0, ut_key: 2.0, min_score: 4}
  QQQ:
    1h:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 5}
    4h:  {adx_threshold: 20.0, ut_key: 3.0, min_score: 5}
    1d:  {adx_threshold: 20.0, ut_key: 2.5, min_score: 5}
  SPY:
    1h:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 5}
    4h:  {adx_threshold: 15.0, ut_key: 1.5, min_score: 5}
    1d:  {adx_threshold: 30.0, ut_key: 2.0, min_score: 4}
  PLTR:
    # RSI2 主力策略：1d Sharpe 0.863 / 1h 0.641 / 4h 0.606；Confluence 全周期为负
    1h:  {adx_threshold: 20.0, ut_key: 2.0, min_score: 4}
    4h:  {adx_threshold: 20.0, ut_key: 2.5, min_score: 4}
    1d:  {adx_threshold: 20.0, ut_key: 2.5, min_score: 4}
  INTC:
    # Confluence 1h Sharpe 0.67（95笔），1d 0.56；4h 无效（0.11）
    1h:  {adx_threshold: 25.0, ut_key: 1.5, min_score: 5}
    4h:  {adx_threshold: 25.0, ut_key: 2.0, min_score: 5}
    1d:  {adx_threshold: 20.0, ut_key: 3.0, min_score: 4}

  # ── 2026-07-25 网格优化新增（对watchlist批量回测中"默认参数接近达标"的60个标的跑
  #    RSI2_GRID×Confluence网格，42个组合达标；此处为Confluence部分的逐标的参数）──
  AMC:
    1h:  {adx_threshold: 30.0, ut_key: 1.5, min_score: 3}  # Sharpe 1.06 N=154 WR=63.6%
  BA:
    4h:  {adx_threshold: 20.0, ut_key: 1.0, min_score: 3}  # Sharpe 0.86 N=85 WR=68.2%
  FWRG:
    4h:  {adx_threshold: 15.0, ut_key: 1.0, min_score: 5}  # Sharpe 0.63 N=74 WR=60.8%
  GFS:
    1h:  {adx_threshold: 30.0, ut_key: 1.0, min_score: 5}  # Sharpe 0.69 N=82 WR=57.3%
  KO:
    4h:  {adx_threshold: 25.0, ut_key: 2.0, min_score: 3}  # Sharpe 0.78 N=41 WR=75.6%
  LLY:
    4h:  {adx_threshold: 20.0, ut_key: 2.0, min_score: 5}  # Sharpe 0.64 N=63 WR=61.9%
  MO:
    1h:  {adx_threshold: 25.0, ut_key: 3.0, min_score: 5}  # Sharpe 0.63 N=117 WR=68.4%
  QCOM:
    4h:  {adx_threshold: 25.0, ut_key: 2.0, min_score: 3}  # Sharpe 1.03 N=47 WR=72.3%
  SLS:
    1h:  {adx_threshold: 30.0, ut_key: 2.5, min_score: 4}  # Sharpe 0.76 N=105 WR=58.1%
  SMCI:
    1h:  {adx_threshold: 15.0, ut_key: 2.0, min_score: 3}  # Sharpe 0.60 N=294 WR=55.4%
  SNAP:
    1d:  {adx_threshold: 15.0, ut_key: 1.0, min_score: 5}  # Sharpe 0.62 N=59 WR=78.0%
  STLA:
    4h:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 3}  # Sharpe 1.14 N=106 WR=64.2%
  TMC:
    1d:  {adx_threshold: 15.0, ut_key: 1.0, min_score: 5}  # Sharpe 0.62 N=31 WR=67.7%
    1h:  {adx_threshold: 15.0, ut_key: 3.0, min_score: 3}  # Sharpe 1.18 N=302 WR=63.2%
  UP:
